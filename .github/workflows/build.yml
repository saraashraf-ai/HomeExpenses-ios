name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          xcodebuild -project HomeExpenses.xcodeproj -scheme HomeExpenses \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Check app binary
        run: test -f build/Build/Products/Release-iphoneos/HomeExpenses.app/HomeExpenses
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HomeExpenses.app Payload/
          zip -r HomeExpenses.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HomeExpenses-ipa
          path: HomeExpenses.ipa
