name: HomeExpenses
options:
  bundleIdPrefix: com.saraashraf
  deploymentTarget:
    iOS: "17.0"
targets:
  HomeExpenses:
    type: application
    platform: iOS
    sources: [HomeExpenses]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saraashraf.homeexpenses
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Home Expenses
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
